name: DMC Backup Downloader API

on:
  workflow_dispatch:
  schedule:
    # සෑම පැය 5කට වරක් ස්වයංක්‍රීයව නැවත පණගැන්වේ (24/7 Non-Stop)
    - cron: '0 */5 * * *'

jobs:
  run-backup-api:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install playwright yt-dlp
          python -m playwright install --with-deps chromium

      - name: Install Node Dependencies
        run: |
          npm install express node-fetch@2 localtunnel

      - name: Start API Server & Keep Tunnel Alive
        run: |
          nohup node server_python_wrapper.js > api.log 2>&1 &
          sleep 5
          cat api.log || true
          end=$((SECONDS+18000))
          while [ $SECONDS -lt $end ]; do
            echo "Starting localtunnel on port 3000..."
            npx localtunnel --port 3000 --subdomain dmc-backup-api || true
            sleep 5
          done
